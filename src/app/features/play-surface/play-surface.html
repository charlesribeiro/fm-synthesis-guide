<p
  class="status"
  [class.status--warning]="status() === 'unavailable' || status() === 'error'"
  role="status"
>
  {{ statusMessage() }}
</p>
@if (status() !== 'ready' && status() !== 'unavailable') {
  <div class="gate">
    <button
      type="button"
      class="button button--primary"
      [disabled]="enabling()"
      (click)="enableAudio()"
    >
      {{ enabling() ? 'Enabling…' : 'Enable audio' }}
    </button>
  </div>
}

<div
  class="keyboard"
  role="group"
  aria-label="One octave keyboard, C4 through B4"
  (contextmenu)="$event.preventDefault()"
>
  @for (key of keys; track key.note) {
    <button
      type="button"
      class="key"
      [class.key--sharp]="key.isSharp"
      [class.key--pressed]="heldNotes().has(key.note)"
      [attr.data-note]="key.note"
      [attr.aria-pressed]="heldNotes().has(key.note)"
      [attr.aria-disabled]="!isReady() ? 'true' : null"
      [attr.tabindex]="!isReady() ? -1 : 0"
      (pointerdown)="onKeyPointerDown($event, key.note)"
      (pointerup)="onKeyPointerUp(key.note)"
      (pointerleave)="onKeyPointerUp(key.note)"
      (pointercancel)="onKeyPointerUp(key.note)"
      (keydown)="onKeyButtonKeydown($event, key.note)"
      (keyup)="onKeyButtonKeyup($event, key.note)"
    >
      <span class="key__name">{{ key.name }}</span>
      <span class="key__hint">{{ key.hint }}</span>
    </button>
  }
</div>

<p class="approximation-badge">Educational approximation — not a bit-accurate DX7 emulation</p>
